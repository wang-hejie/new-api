# New-API Docker Compose 模板配置
#
# ⚠️  本文件是入库模板, 不包含任何真实密码; 真实环境配置请复制为 docker-compose.yml 并修改:
#     cp docker-compose.example.yml docker-compose.yml
#
# Quick Start:
#   1. cp docker-compose.example.yml docker-compose.yml
#   2. 修改 docker-compose.yml 中所有标记为 CHANGE_ME 的字段为强密码
#   3. 按需调整 ports 端口映射
#   4. docker-compose up -d --build
#   5. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line
#   2. Uncomment the mysql service and SQL_DSN line
#   3. Uncomment mysql in depends_on
#   4. Uncomment mysql_data in volumes section
#
# ⚠️  IMPORTANT: 部署到生产环境前务必修改所有默认密码!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:local
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"  # 生产环境建议改为 "127.0.0.1:9991:3000" 并通过反向代理暴露
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:CHANGE_ME_DB_PASSWORD@postgres:5432/new-api # ⚠️ 必须修改!
#      - SQL_DSN=root:CHANGE_ME_DB_PASSWORD@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:CHANGE_ME_REDIS_PASSWORD@redis:6379 # ⚠️ 必须修改!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称, 用于审计日志中标识节点身份; 多节点/容器部署时建议设置
      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间, 单位秒, 默认120秒, 如果出现空补全可以尝试改为更大值
#      - SESSION_SECRET=random_string  # 多机部署时设置, 必须修改这个随机字符串!!
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL, 默认为官方地址

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "CHANGE_ME_REDIS_PASSWORD"]  # ⚠️ 必须修改! 且与 REDIS_CONN_STRING 中保持一致
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD  # ⚠️ 必须修改! 且与 SQL_DSN 中保持一致
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: CHANGE_ME_DB_PASSWORD  # ⚠️ 必须修改!
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
