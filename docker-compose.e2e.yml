version: '3.4'

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:e2e-docs
    container_name: new-api-e2e-docs
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:9992:3000"
    volumes:
      - new_api_e2e_data:/data
      - new_api_e2e_logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:e2eDocsPostgresPass@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:e2eDocsRedisPass@redis:6379
      - SESSION_SECRET=e2e-docs-session-secret
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=false
      - GLOBAL_API_RATE_LIMIT_ENABLE=false
      - CRITICAL_RATE_LIMIT_ENABLE=false
      - SEARCH_RATE_LIMIT_ENABLE=false
      - NODE_NAME=new-api-e2e-docs
      - STREAMING_TIMEOUT=300
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-e2e-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:latest
    container_name: redis-e2e-docs
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "e2eDocsRedisPass"]
    networks:
      - new-api-e2e-network

  postgres:
    image: postgres:15
    container_name: postgres-e2e-docs
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: e2eDocsPostgresPass
      POSTGRES_DB: new-api
    volumes:
      - pg_data_e2e_docs:/var/lib/postgresql/data
    networks:
      - new-api-e2e-network

volumes:
  new_api_e2e_data:
  new_api_e2e_logs:
  pg_data_e2e_docs:

networks:
  new-api-e2e-network:
    driver: bridge
