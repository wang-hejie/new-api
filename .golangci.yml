version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    staticcheck:
      # Keep staticcheck focused on correctness checks during CI adoption.
      # Style/simplification families (S/ST/QF) are historical debt and should
      # be enabled incrementally after the existing codebase is cleaned up.
      checks:
        - all
        - "-S*"
        - "-ST*"
        - "-QF*"

  exclusions:
    rules:
      # Existing codebase has broad unchecked cleanup/write errors. Keep
      # errcheck enabled for future tightening, but do not block CI adoption on
      # historical Close/Write/logging cleanup debt in this pass.
      - linters:
          - errcheck
        text: "Error return value"

      # These deprecated handlers are still registered as compatibility routes;
      # deleting or replacing the routes would change the public API surface.
      - path: router/api-router\.go
        linters:
          - staticcheck
        text: "SA1019: controller\\.Search(All|User)Logs is deprecated"

      # The repository contains historical helpers and compatibility symbols that
      # are unused in the current build graph. Removing them needs separate
      # feature-owner review, so unused remains enabled but the legacy backlog is
      # excluded for this CI bring-up.
      - linters:
          - unused
        text: "is unused"

    paths:
      - web
      - data
      - logs
      - upload
      - build
      - tiktoken_cache
      - \.gocache
      - \.gomodcache
      - \.gopath
      - \.cache

formatters:
  exclusions:
    paths:
      - web
      - data
      - logs
      - upload
      - build
      - tiktoken_cache
      - \.gocache
      - \.gomodcache
      - \.gopath
      - \.cache

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
